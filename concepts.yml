context: membership
name: Membership
intro: >-
  The common membership vocabulary -- the members of an association, club or gym, the memberships
  they hold, the membership types and levels on offer and the chapters they belong to --
  distilled from the APIs that already exist. Dues invoices belong to billing.
tags: [Membership, Associations, Membership Management, Association Management, Clubs, Gyms, Member Management]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id, member_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, joined_at, join_date]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, member_status, membership_status, active, is_active]
  name: [title, display_name, label, full_name]

concepts:
  member:
    segments: [members, member, clients@gym|studio, contacts@members|association]
    aliases:
      first_name: [firstname, given_name]
      last_name: [lastname, surname, family_name]
      email: [email_address, emails]
      phone: [phone_number, mobile, mobile_phone]
      member_number: [membership_number, member_code, number]
      membership_type_id: [membership_type, level_id, level, tier, plan_id]
  # membership, membership_type and chapter were measured and dropped: 3 (agreeing only on an id),
  # 0 and 0 providers.

findings:
  - "A member agrees on id, email and status across association, club and gym platforms -- and
    that is all membership publishes in common (26 providers, 9 mapped). Memberships, levels and
    chapters are kept inside the products."
decisions:
  - "Members are `/members`, the market's word: inside this cohort it means only one thing (HR
    excluded it as workspace members, identity counts it as users)."
  - "Dues are billing's invoices; events are the events context's."
  - "Memberships, membership types and chapters were measured and dropped."
